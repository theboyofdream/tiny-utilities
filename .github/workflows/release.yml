name: Release

on:
  push:
    branches:
      - 'release'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag override (optional, defaults to VERSION file)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x64
            msvc_arch: x64
          - arch: arm64
            msvc_arch: x64_arm64

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup MSVC Toolchain (${{ matrix.arch }})
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build & Package All Utilities (${{ matrix.arch }})
        run: pwsh -File .\build.ps1 -Mode release -Arch ${{ matrix.arch }} -Package all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/packages/${{ matrix.arch }}/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Determine Release Tag
        run: |
          $inputTag = '${{ github.event.inputs.tag_name }}'
          $tag = if ($inputTag) { $inputTag } else { "v$((Get-Content VERSION).Trim().TrimStart('v'))" }
          echo "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.ref_name }}
          name: Tiny Windows Utilities ${{ env.RELEASE_TAG }}
          files: |
            release-assets/*.exe
            release-assets/*.zip
          generate_release_notes: true
